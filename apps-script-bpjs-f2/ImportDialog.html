<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 13px; color: #222; padding: 8px 16px; }
  h3 { margin: 12px 0 4px; }
  .row { margin-bottom: 10px; }
  select, input[type=file] { font-size: 13px; padding: 4px; }
  button { font-size: 13px; padding: 6px 14px; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.6; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border: 1px solid #ccc; padding: 3px 6px; text-align: right; font-size: 12px; }
  th { background: #f2f2f2; }
  td.text { text-align: left; }
  #status { margin-top: 10px; white-space: pre-wrap; }
  .error { color: #b00020; }
  .ok { color: #0a7a2f; }
  #previewWrap { max-height: 260px; overflow: auto; border: 1px solid #ddd; }
</style>
</head>
<body>

<div class="row">
  <input type="file" id="pdfFile" accept="application/pdf">
</div>

<div id="infoBox" class="row" style="display:none;">
  <div><b>NPP:</b> <span id="infoNpp"></span></div>
  <div><b>Nama Perusahaan:</b> <span id="infoPerusahaan"></span></div>
  <div><b>Nama Unit Kerja:</b> <span id="infoUnit"></span></div>
  <div><b>Periode Laporan:</b> <span id="infoPeriode"></span></div>
</div>

<div class="row" id="sheetPickRow" style="display:none;">
  <label><b>Masuk ke sheet lokasi:</b></label>
  <select id="sheetSelect"></select>
</div>

<div id="previewWrap" style="display:none;">
  <table id="previewTable">
    <thead>
      <tr>
        <th class="text">Nama</th><th class="text">No. KPJ</th>
        <th>JKK</th><th>JKM</th><th>JHT (total)</th><th>JHT (karyawan)</th><th>JP</th><th>JKP</th>
      </tr>
    </thead>
    <tbody id="previewBody"></tbody>
  </table>
</div>

<div class="row" style="margin-top: 14px;">
  <button id="btnProses" disabled>Proses ke Spreadsheet</button>
  <button id="btnTutup" onclick="google.script.host.close()">Tutup</button>
</div>

<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Batas kolom (dalam satuan titik PDF) untuk Formulir 2a PU BPJS Ketenagakerjaan.
// Diverifikasi dari contoh PDF asli; berlaku selama BPJS tidak mengubah template.
var TOP_COLS = [
  { key: 'npp', start: 0 },
  { key: 'perusahaan', start: 142 },
  { key: 'unitKerja', start: 446 },
  { key: 'periode', start: 741 }
];
// Batas dihitung dari posisi kolom data asli (bukan label header, karena label
// header ternyata tidak sejajar dengan awal data di template ini).
var TABLE_COLS = [
  { key: 'no', start: 0 },
  { key: 'nomorReferensi', start: 28 },
  { key: 'nik', start: 77 },
  { key: 'nomorPegawai', start: 150 },
  { key: 'nama', start: 190 },
  { key: 'tglLahir', start: 295 },
  { key: 'tglKepesertaan', start: 350 },
  { key: 'upah', start: 410 },
  { key: 'rapel', start: 490 },
  { key: 'jkk', start: 542 },
  { key: 'jkm', start: 597 },
  { key: 'jhtPK', start: 650 },
  { key: 'jhtTK', start: 712 },
  { key: 'jpPK', start: 780 },
  { key: 'jpTK', start: 839 },
  { key: 'jkpPK', start: 899 },
  { key: 'jkpPemerintah', start: 958 },
  { key: 'total', start: 1013 }
];

function classify(x, cols) {
  var key = cols[0].key;
  for (var i = 0; i < cols.length; i++) {
    if (x >= cols[i].start) key = cols[i].key;
  }
  return key;
}

function groupRows(items) {
  // cluster berdasarkan y (toleransi 3pt), lalu urutkan tiap baris berdasarkan x
  var sorted = items.slice().sort(function (a, b) { return b.y - a.y; });
  var rows = [];
  var current = null;
  var lastY = null;
  sorted.forEach(function (it) {
    if (current === null || Math.abs(it.y - lastY) > 3) {
      current = [];
      rows.push(current);
      lastY = it.y;
    }
    current.push(it);
  });
  rows.forEach(function (r) { r.sort(function (a, b) { return a.x - b.x; }); });
  return rows;
}

function parseMoney(s) {
  // Format PDF: koma sebagai pemisah ribuan, titik sebagai desimal (mis. "6,600.33").
  return parseFloat(String(s).replace(/,/g, '')) || 0;
}

async function parsePdf(file) {
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;

  // baris info perusahaan: baris yang punya token murni digit 2 karakter
  // (bulan) diikuti token 4 digit (tahun) di zona "periode", dan token panjang
  // di zona NPP.
  var info = { npp: '', perusahaan: '', unitKerja: '', periode: '' };
  var employees = [];

  for (var p = 1; p <= pdf.numPages; p++) {
    var page = await pdf.getPage(p);
    var content = await page.getTextContent();
    var pageItems = [];
    content.items.forEach(function (it) {
      var text = it.str.trim();
      if (text === '') return;
      pageItems.push({ text: text, x: it.transform[4], y: it.transform[5] });
    });

    // Penting: kelompokkan baris PER HALAMAN, bukan digabung dulu semua halaman.
    // Tiap halaman F2 punya sistem koordinat sendiri yang mulai dari 0 lagi, dan
    // baris ke-1 di halaman 2 biasanya jatuh di y yang SAMA persis dengan baris
    // ke-1 di halaman 1 (template berulang). Kalau digabung dulu baru
    // dikelompokkan, baris dari halaman berbeda yang kebetulan y-nya sama akan
    // tergabung jadi satu baris (nama/nomor dari 2 karyawan berbeda bercampur).
    var rows = groupRows(pageItems);

    rows.forEach(function (row) {
      var tokens = row.map(function (it) { return it.text; });
      var firstTok = tokens[0];

      // baris data karyawan: token pertama angka kecil (No.), dan ada NIK 16 digit
      var hasNik = tokens.some(function (t) { return /^\d{16}$/.test(t); });
      if (/^\d{1,3}$/.test(firstTok) && hasNik) {
        var buckets = {};
        row.forEach(function (it) {
          var key = classify(it.x, TABLE_COLS);
          buckets[key] = buckets[key] ? buckets[key] + ' ' + it.text : it.text;
        });
        employees.push({
          nomorReferensi: (buckets.nomorReferensi || '').trim(),
          nik: (buckets.nik || '').trim(),
          nama: (buckets.nama || '').trim(),
          jkk: parseMoney(buckets.jkk),
          jkm: parseMoney(buckets.jkm),
          jhtPK: parseMoney(buckets.jhtPK),
          jhtTK: parseMoney(buckets.jhtTK),
          jpPK: parseMoney(buckets.jpPK),
          jpTK: parseMoney(buckets.jpTK),
          jkpPK: parseMoney(buckets.jkpPK),
          jkpPemerintah: parseMoney(buckets.jkpPemerintah)
        });
        return;
      }

      // baris info perusahaan/NPP/periode: mengandung NPP (6-9 digit) di token pertama
      if (/^\d{6,9}$/.test(firstTok)) {
        var ibuckets = {};
        row.forEach(function (it) {
          var key = classify(it.x, TOP_COLS);
          ibuckets[key] = ibuckets[key] ? ibuckets[key] + ' ' + it.text : it.text;
        });
        info.npp = (ibuckets.npp || '').trim();
        info.perusahaan = (ibuckets.perusahaan || '').trim();
        info.unitKerja = (ibuckets.unitKerja || '').trim();
        info.periode = (ibuckets.periode || '').trim();
      }
    });
  }

  return { info: info, employees: employees };
}

function parsePeriode(periodeText) {
  var parts = String(periodeText || '').trim().split(/\s+/);
  return { month: parts[0] || '', year: parts[1] || '' };
}

async function fileToBase64(file) {
  var buf = await file.arrayBuffer();
  var bytes = new Uint8Array(buf);
  var binary = '';
  var chunk = 0x8000;
  for (var i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

// Nama di PDF (resmi, lengkap) sering ditulis lebih singkat di tab sheet.
// Daftar padanan umum ini membantu pencocokan otomatis; tetap harus dikonfirmasi
// manual lewat dropdown karena tidak menjamin 100% benar untuk semua 250 lokasi.
var ABBREV = [
  [/\bKEJAKSAAN NEGERI\b/g, 'KEJARI'],
  [/\bKABUPATEN\b/g, 'KAB'],
  [/\bKOTA\b/g, 'KT'],
  [/\bPROVINSI\b/g, 'PROV'],
  [/\bKECAMATAN\b/g, 'KEC']
];

function normalizeName(s) {
  return String(s || '')
    .toUpperCase()
    .replace(/RAY MITRA PERKASA/g, '')
    .replace(/[^A-Z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function abbreviate(s) {
  var out = s;
  ABBREV.forEach(function (pair) { out = out.replace(pair[0], pair[1]); });
  return out;
}

function scoreMatch(nameNorm, targetVariant) {
  if (nameNorm === targetVariant) return 1000;
  if (targetVariant.indexOf(nameNorm) !== -1 || nameNorm.indexOf(targetVariant) !== -1) return 500;
  var nTokens = nameNorm.split(' ').filter(Boolean);
  var targetTokens = targetVariant.split(' ').filter(Boolean);
  var score = 0;
  nTokens.forEach(function (t) { if (targetTokens.indexOf(t) !== -1) score++; });
  return score;
}

function guessSheet(names, targetText) {
  var target = normalizeName(targetText);
  var targetAbbrev = abbreviate(target);
  var best = null, bestScore = -1;
  names.forEach(function (name) {
    var n = normalizeName(name);
    var score = Math.max(scoreMatch(n, target), scoreMatch(n, targetAbbrev));
    if (score > bestScore) { bestScore = score; best = name; }
  });
  return best;
}

var parsedData = null;
var sheetNamesCache = null;

document.getElementById('pdfFile').addEventListener('change', async function (e) {
  var file = e.target.files[0];
  if (!file) return;
  setStatus('Membaca PDF...', '');
  try {
    parsedData = await parsePdf(file);
    if (parsedData.employees.length === 0) {
      setStatus('Tidak ada baris karyawan yang terbaca dari PDF ini. Pastikan file adalah Formulir 2a PU BPJS Ketenagakerjaan.', 'error');
      return;
    }
    parsedData.pdfBase64 = await fileToBase64(file);
    renderInfo(parsedData.info);
    renderPreview(parsedData.employees);
    await ensureSheetNames();
    var guess = guessSheet(sheetNamesCache, parsedData.info.unitKerja || parsedData.info.perusahaan);
    populateSheetSelect(sheetNamesCache, guess);
    document.getElementById('btnProses').disabled = false;
    setStatus(parsedData.employees.length + ' baris karyawan terbaca. Periksa sheet tujuan di bawah sebelum memproses.', 'ok');
  } catch (err) {
    setStatus('Gagal membaca PDF: ' + err.message, 'error');
  }
});

function ensureSheetNames() {
  if (sheetNamesCache) return Promise.resolve(sheetNamesCache);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (names) { sheetNamesCache = names; resolve(names); })
      .withFailureHandler(reject)
      .listLocationSheets();
  });
}

function populateSheetSelect(names, guess) {
  var sel = document.getElementById('sheetSelect');
  sel.innerHTML = '';
  names.forEach(function (name) {
    var opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === guess) opt.selected = true;
    sel.appendChild(opt);
  });
  document.getElementById('sheetPickRow').style.display = 'block';
}

function renderInfo(info) {
  document.getElementById('infoNpp').textContent = info.npp;
  document.getElementById('infoPerusahaan').textContent = info.perusahaan;
  document.getElementById('infoUnit').textContent = info.unitKerja;
  document.getElementById('infoPeriode').textContent = info.periode;
  document.getElementById('infoBox').style.display = 'block';
}

function fmt(n) { return n.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function renderPreview(employees) {
  var body = document.getElementById('previewBody');
  body.innerHTML = '';
  employees.forEach(function (e) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="text">' + e.nama + '</td>' +
      '<td class="text">' + e.nomorReferensi + '</td>' +
      '<td>' + fmt(e.jkk) + '</td>' +
      '<td>' + fmt(e.jkm) + '</td>' +
      '<td>' + fmt(e.jhtPK + e.jhtTK) + '</td>' +
      '<td>' + fmt(e.jhtTK) + '</td>' +
      '<td>' + fmt(e.jpPK + e.jpTK) + '</td>' +
      '<td>' + fmt(e.jkpPK + e.jkpPemerintah) + '</td>';
    body.appendChild(tr);
  });
  document.getElementById('previewWrap').style.display = 'block';
}

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

document.getElementById('btnProses').addEventListener('click', function () {
  if (!parsedData) return;
  var sheetName = document.getElementById('sheetSelect').value;
  document.getElementById('btnProses').disabled = true;
  setStatus('Menulis ke sheet "' + sheetName + '"...', '');
  google.script.run
    .withSuccessHandler(function (result) {
      setStatus('Selesai. ' + result.updated + ' baris diupdate, ' + result.added + ' baris baru ditambahkan (dari ' + result.total + ' karyawan di PDF).', 'ok');
      document.getElementById('btnProses').disabled = false;
    })
    .withFailureHandler(function (err) {
      setStatus('Gagal menulis ke spreadsheet: ' + err.message, 'error');
      document.getElementById('btnProses').disabled = false;
    })
    .importToSheet({
      sheetName: sheetName,
      employees: parsedData.employees,
      periode: parsePeriode(parsedData.info.periode),
      pdfBase64: parsedData.pdfBase64
    });
});
</script>
</body>
</html>
